services:
  - type: web
    name: buildtrack
    env: php
    buildCommand: composer install --no-dev && cp .env.example .env && php artisan key:generate && php artisan migrate --force
    startCommand: php artisan serve --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: BuildTrack
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: pgsql
      - key: SESSION_DOMAIN
        value: .onrender.com
      - key: SANCTUM_STATEFUL_DOMAINS
        value: "*.onrender.com"